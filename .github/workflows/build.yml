name: build & deploy

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: mamba-org/setup-micromamba@v2
        with:
          environment-file: environment.yml
          cache-environment: true

      - name: Build data + site payload
        shell: bash -el {0}
        run: Rscript build.R

      - name: Show build report
        run: cat BUILD_REPORT.md >> "$GITHUB_STEP_SUMMARY"

      - name: Fail if tidy tables are stale (commit the regenerated data/tidy/)
        run: |
          if ! git diff --quiet -- data/tidy; then
            echo "::error::data/tidy is out of date — run 'Rscript build.R' and commit the result."
            git diff --stat -- data/tidy
            exit 1
          fi

      - name: JS parse check
        shell: bash -el {0}
        run: esbuild site/assets/app.js --log-level=warning >/dev/null

      - name: Headless smoke test
        shell: bash -el {0}
        run: deno run -A test/smoke.mjs

      - name: Assemble Pages artifact
        run: |
          mkdir -p _site
          cp -r site/* _site/
          touch _site/.nojekyll

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  # Deploy is opt-in: GitHub Pages can't be enabled on a private repo without a
  # paid plan, and the deploy step 404s until Pages is on. Once the repo is
  # public (or on a plan with private Pages) and Pages is enabled, add a repo
  # variable PAGES_ENABLED=true (Settings -> Secrets and variables -> Actions ->
  # Variables) to turn this on. Until then the job is skipped, not failed.
  deploy:
    if: >-
      github.ref == 'refs/heads/main'
      && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
      && vars.PAGES_ENABLED == 'true'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
